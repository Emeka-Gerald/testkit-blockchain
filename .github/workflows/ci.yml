name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC — see the scheduled-sdk-check job below.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Least-privilege GITHUB_TOKEN. Every job inherits read-only access to the
# repository contents and nothing else. A job that needs more declares its
# own `permissions:` block (which replaces this default, so it must restate
# `contents: read`) with a comment saying why. See CONTRIBUTING.md
# "CI workflow permissions"; the `lint` job and `crates/cli/tests/repo_config.rs`
# fail if a workflow drops this block or grants `write-all`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust edition policy (see CONTRIBUTING.md)
        run: |
          status=0
          if ! grep -qxF 'edition = "2021"' Cargo.toml; then
            echo "::error file=Cargo.toml::workspace edition must be declared in [workspace.package]"
            status=1
          fi
          for manifest in crates/*/Cargo.toml examples/*/Cargo.toml; do
            if ! grep -qxF 'edition.workspace = true' "$manifest"; then
              echo "::error file=$manifest::must set 'edition.workspace = true'"
              status=1
            fi
          done
          exit $status
      - name: Library and CLI stay decoupled (see ARCHITECTURE.md)
        run: |
          status=0
          if cargo tree -p soroban-testkit -e normal --prefix none | grep -q '^soroban-testkit-cli v'; then
            echo "::error::soroban-testkit must not depend on soroban-testkit-cli"
            status=1
          fi
          if cargo tree -p soroban-testkit-cli -e normal --prefix none | grep -q '^soroban-testkit v'; then
            echo "::error::soroban-testkit-cli must not depend on soroban-testkit"
            status=1
          fi
          exit $status
      - name: testutils stays out of the example's normal dependency graph
        run: |
          # Issue #227: feature boundaries.
          # `examples/vault` is compiled to wasm by the CLI's integration
          # tests, so `soroban-sdk/testutils` (host-only) must never reach
          # its normal dependency graph — only dev-dependencies and the
          # explicit `testutils` feature may enable it.
          status=0
          if cargo tree -p vault -e normal -e features --prefix none | grep -q 'soroban-sdk feature "testutils"'; then
            echo "::error::soroban-sdk/testutils leaked into vault's normal dependency graph"
            cargo tree -p vault -e normal -e features
            status=1
          fi
          exit $status
      - name: Workflow token permissions are least-privilege (see CONTRIBUTING.md)
        run: |
          status=0
          for workflow in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$workflow"; then
              echo "::error file=$workflow::must declare a top-level 'permissions:' block"
              status=1
            fi
            if grep -Eq 'permissions:[[:space:]]*(write-all|read-all)' "$workflow"; then
              echo "::error file=$workflow::must not use 'write-all' or 'read-all'; list each scope"
              status=1
            fi
          done
          exit $status
      - name: Workspace package inventory matches cargo metadata (see ARCHITECTURE.md)
        run: |
          # Issue #259: Workspace package inventory validation
          # Verify that documented packages/examples in ARCHITECTURE.md match actual workspace
          status=0
          cargo metadata --format-version 1 --offline 2>/dev/null | jq -r '.packages[] | select(.source == null) | .name' | sort > /tmp/actual_packages.txt

          # Check that we have exactly the documented workspace members
          expected="soroban-testkit
          soroban-testkit-cli
          vault"
          echo "$expected" | sort > /tmp/expected_packages.txt

          if ! diff -q /tmp/expected_packages.txt /tmp/actual_packages.txt >/dev/null 2>&1; then
            echo "::error::Workspace packages don't match ARCHITECTURE.md. Expected:"
            cat /tmp/expected_packages.txt
            echo "Actual:"
            cat /tmp/actual_packages.txt
            status=1
          fi
          exit $status

  test:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32v1-none is needed by the CLI's integration tests, which
          # build examples/vault to a real .wasm to test `limits` against.
          targets: wasm32v1-none
      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/*/lib/rustlib/wasm32v1-none
          key: wasm32v1-none-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            wasm32v1-none-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Verify tests and CLI work without network access
        if: runner.os != 'Windows'
        run: |
          sudo unshare --net -- runuser -u "$USER" --preserve-environment -- env CARGO_NET_OFFLINE=true cargo test --workspace --offline
          sudo unshare --net -- runuser -u "$USER" --preserve-environment -- env CARGO_NET_OFFLINE=true cargo run --offline -p soroban-testkit-cli -- --help
      - name: Verify tests and CLI work without network access (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:CARGO_NET_OFFLINE="true"
          cargo test --workspace --offline
          cargo run --offline -p soroban-testkit-cli -- --help
      - name: Validate soroban-testkit package contents
        run: |
          files="$(cargo package -p soroban-testkit --list)"
          if printf '%s\n' "$files" | grep -q '^tests/'; then
            echo "::error::soroban-testkit package must exclude workspace integration tests"
            exit 1
          fi

  examples:
    name: compile public examples
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/*/lib/rustlib/wasm32v1-none
          key: wasm32v1-none-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            wasm32v1-none-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
      - name: Build all examples
        run: cargo build --examples --target wasm32v1-none --release

  doc:
    name: cargo doc
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate README documentation links
        run: cargo test -p soroban-testkit-cli --test repo_config readme_links_resolve_to_current_paths
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: docs.rs configuration (mirrors [package.metadata.docs.rs])
        run: cargo doc -p soroban-testkit --no-deps --target x86_64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  audit:
    name: cargo audit
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  min-deps:
    name: minimum dependency versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Issue #274: Validate workspace against minimum declared dependencies
      # -Z minimal-versions resolves dependencies to their oldest compatible versions
      # rather than newest, catching cases where we rely on newer features without
      # declaring minimum version bounds
      - name: Generate Cargo.lock with minimal versions
        run: cargo +nightly generate-lockfile -Z minimal-versions
      - uses: dtolnay/rust-toolchain@stable
      - name: Check with minimal dependency versions
        run: cargo check --workspace --all-targets
      # Known limitations (documented):
      # - Does not catch minimum version issues in dev-dependencies of dependencies
      # - May fail if upstream crates have incorrect minimum version declarations
      # - Nightly-only feature, may break on toolchain updates

  deny:
    name: cargo deny
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: Verify the license allowlist
        run: cargo deny check licenses
      - name: Verify all cargo-deny policies
        run: cargo deny check

  coverage:
    name: code coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/*/lib/rustlib/wasm32v1-none
          key: wasm32v1-none-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            wasm32v1-none-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  scheduled-sdk-check:
    name: scheduled test against latest soroban-sdk
    # Runs weekly against whatever soroban-sdk version crates.io currently
    # considers latest, independent of the pinned version in Cargo.toml, so a
    # breaking upstream release is caught before a contributor hits it in a
    # PR. Also runnable on demand from the Actions tab.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `issues: write` is needed only by the failure step below, which opens
    # a tracking issue. This job never runs on pull_request, so PR code never
    # holds a write token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/*/lib/rustlib/wasm32v1-none
          key: wasm32v1-none-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            wasm32v1-none-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
      - name: Update soroban-sdk to the latest stable release
        run: cargo update -p soroban-sdk
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Open an issue if the scheduled run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled latest-SDK test failed (run ${context.runId})`,
              body: `The weekly test against the latest stable soroban-sdk failed. See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'upstream-sdk'],
            });

  scheduled-nightly-check:
    name: scheduled nightly toolchain compatibility
    # Detect upstream nightly compiler changes without changing the pinned
    # release toolchain. Runs on-demand and weekly so we catch incompatibilities
    # before a contributor hits them, but don't spam noise weekly if stable
    # just works fine.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32v1-none
      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/*/lib/rustlib/wasm32v1-none
          key: wasm32v1-none-nightly-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          restore-keys: |
            wasm32v1-none-nightly-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly build --workspace
      - run: cargo +nightly test --workspace
      - name: Open an issue if nightly compatibility fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly toolchain compatibility check failed (run ${context.runId})`,
              body: `The weekly check against the latest nightly toolchain failed. This may indicate an upstream compiler change that will eventually affect the pinned stable toolchain. See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'upstream-toolchain'],
            });
