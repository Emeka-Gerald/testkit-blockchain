name: Bug report
description: Something in soroban-testkit doesn't behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, review the [scope boundaries](../../BUILD_SPEC.md#3-scope-boundaries),
        [architecture](../../ARCHITECTURE.md), and
        [contribution guidance](../../CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  # Applied as a label by .github/workflows/issue-triage.yml. Keep option
  # text in sync with the LABELS map there; crates/cli/tests/repo_config.rs
  # enforces it.
  - type: dropdown
    id: module-select
    attributes:
      label: Module
      description: Which module is affected? Applied as a label automatically.
      options:
        - core (crates/testkit/src/core/)
        - money (crates/testkit/src/money/)
        - events (crates/testkit/src/events/)
        - auth (crates/testkit/src/auth/)
        - ttl (crates/testkit/src/ttl/)
        - cli (crates/cli/)
        - docs only (no public API change)
        - not sure (maintainers will triage)
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module or file path
      placeholder: crates/testkit/src/events/assertions.rs
    validations:
      required: true
  # Applied as a label by .github/workflows/issue-triage.yml. Keep option
  # text in sync with the LABELS map there; crates/cli/tests/repo_config.rs
  # enforces it.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug? Applied as a label automatically.
      options:
        - critical (incorrect results or a crash with no workaround)
        - high (incorrect results or a crash with a workaround)
        - low (cosmetic, docs, or minor inconvenience)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, inputs, or test command needed to reproduce the bug.
      render: rust
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior will confirm this bug is fixed?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: soroban-testkit / soroban-sdk versions
      placeholder: soroban-testkit 0.1.0, soroban-sdk 27.0.6
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`
      placeholder: rustc 1.80.0 (2024-07-21)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, build system, and any other relevant details
      placeholder: |
        OS: Linux (Ubuntu 22.04)
        Build system: cargo
        CPU: x86_64
      render: plain
