name: Feature request
description: Propose a new module, generator, assertion, or CLI capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, review the [scope boundaries](../../BUILD_SPEC.md#3-scope-boundaries),
        [architecture](../../ARCHITECTURE.md), and
        [contribution guidance](../../CONTRIBUTING.md). Proposals for
        mainnet/testnet forking, deployment tooling, frontend/JS testing,
        a test runner, or network-dependent features will be declined.
  - type: checkboxes
    id: scope_review
    attributes:
      label: Scope review
      options:
        - label: I reviewed [BUILD_SPEC.md §3 (Scope boundaries)](../../BUILD_SPEC.md#3-scope-boundaries) and confirm this proposal is in scope.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What testing gap does this fill?
    validations:
      required: true
  # The "Module" and "Size" selections are turned into labels by
  # .github/workflows/issue-triage.yml. Keep option text in sync with the
  # LABELS map there; crates/cli/tests/repo_config.rs enforces it.
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this change? Applied as a label automatically.
      options:
        - core (crates/testkit/src/core/)
        - money (crates/testkit/src/money/)
        - events (crates/testkit/src/events/)
        - auth (crates/testkit/src/auth/)
        - ttl (crates/testkit/src/ttl/)
        - cli (crates/cli/)
        - docs only (no public API change)
        - not sure (maintainers will triage)
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Rough effort estimate. Maintainers may adjust it.
      options:
        - s (under an hour)
        - m (a sitting)
        - l (multiple sittings)
    validations:
      required: false
  - type: input
    id: paths
    attributes:
      label: Affected file paths
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior / proposed public API
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Use case and reproduction steps
      description: Describe a concrete scenario that demonstrates the testing gap.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: How to test locally
    validations:
      required: true
