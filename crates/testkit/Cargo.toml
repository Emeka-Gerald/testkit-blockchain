[package]
name = "soroban-testkit"
description = "Testing infrastructure for Soroban contracts: money-math generators, event assertions, ledger time and TTL control, token test doubles, and authorization matrices."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["soroban", "testing", "contracts", "stellar", "wasm"]
categories = ["development-tools::testing"]
exclude = ["tests/**"]

[lib]
doctest = true

# docs.rs build configuration. The crate is a host-side test library: it
# always enables `soroban-sdk/testutils` (see [dependencies]), which only
# compiles for the host, never for `wasm32v1-none`. docs.rs therefore builds
# a single host target, with no extra feature flags — the Soroban features
# the docs need are already unconditional. `--cfg docsrs` is passed so
# docs-only attributes can be gated on it. Verify locally with `make docsrs`.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
thiserror.workspace = true

[dev-dependencies]
vault = { path = "../../examples/vault", features = ["testutils"] }

# Published crate feature behavior:
# soroban-testkit currently offers no optional or configurable Cargo features.
# All capabilities are host-side testing utilities enabled unconditionally with
# `soroban-sdk/testutils`.
[features]

